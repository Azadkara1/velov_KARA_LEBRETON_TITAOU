name: retrain

# Réentraînement planifié : chaque lundi à 03:00 UTC, et à la demande.
# Le serveur MLflow de la VM n'est pas joignable depuis un runner GitHub : ce workflow entraîne,
# applique les garde-fous (tests de modèle) et publie le paquet comme artefact du run.
# La promotion au registre reste une décision prise sur la VM (python -m velov.registry promote).
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip install -e .
      - run: python -m velov.data && python -m velov.train --out models/
      - run: pytest tests/test_model.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-package
          path: models/
          retention-days: 30
