name: ci

on:
  push:
    branches: [main, "tp*"]
  pull_request:

# Droits minimaux : la CI lit le code, rien d'autre. Un job qui en a besoin les relève lui-même.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Les actions sont épinglées sur un SHA de commit, pas sur un tag : un tag (v4) peut être déplacé
# par son auteur, ou par quelqu'un qui a pris son compte, et exécuterait alors un autre code
# dans notre CI. Le SHA, lui, désigne un contenu précis. Le tag est rappelé en commentaire.
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.9
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip install -e .
      # Inclut tests/test_model.py : le modèle entraîné doit battre la baseline, rester plausible
      # et être reproductible. La règle de promotion (tests/test_registry.py) y est aussi testée.
      - run: pytest

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # tout l'historique : un secret supprimé du dernier commit reste dans git
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Construit l'image de serving et vérifie qu'elle démarre ET sait prédire (/ready, pas /health).
  # Rattrape ce qu'un test Python ne voit pas : une dépendance manquante dans l'image (déjà arrivé :
  # l'API importait pandera, absent de requirements.txt, et le conteneur plantait au démarrage).
  image:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip install -e .
      - run: python -m velov.data --days 30 --stations 5 && python -m velov.train --test-days 7
      - run: docker build -t velov-api:ci-${{ github.sha }} .
      - name: Démarrage et /ready
        run: |
          docker run -d --name api -p 8000:8000 velov-api:ci-${{ github.sha }}
          for i in $(seq 1 30); do curl -sf http://localhost:8000/ready && exit 0; sleep 2; done
          docker logs api
          exit 1
