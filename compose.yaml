services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      MODEL_DIR: /app/models
      DATABASE_URL: >-
        postgresql://velov:${POSTGRES_PASSWORD:?}@db:5432/velov
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: velov
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: velov
    # TP3 : le pipeline (ingestion, dbt) tourne sur l'hôte et doit joindre la base.
    # Publié sur la boucle locale uniquement : invisible depuis le réseau.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velov"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
