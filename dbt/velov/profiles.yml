# Aucun secret ici : le mot de passe vient de l'environnement (même variable que compose.yaml).
# Lancer depuis le dossier dbt/velov :  dbt build --profiles-dir .
velov:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: velov
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: velov
      schema: public
      threads: 2
